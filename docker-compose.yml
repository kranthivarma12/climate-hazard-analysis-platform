version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: climate_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: climate_hazard
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: climate_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/climate_hazard
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8001
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: climate_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_PORT=8001
    depends_on:
      - backend

volumes:
  mongo_data:
